apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: buildplane
  labels:
    app: api
spec:
  selector:
    app: api
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      nodePort: 30080
  type: NodePort
---
apiVersion: v1
kind: Service
metadata:
  name: scheduler
  namespace: buildplane
  labels:
    app: scheduler
spec:
  selector:
    app: scheduler
  ports:
    - name: metrics
      port: 8080
      targetPort: 8080
