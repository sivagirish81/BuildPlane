apiVersion: v1
kind: ServiceAccount
metadata:
  name: buildplane-scheduler
  namespace: buildplane
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: buildplane-runner
  namespace: buildplane
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: buildplane-scheduler
  namespace: buildplane
rules:
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["create", "get", "list", "watch", "delete"]
  - apiGroups: [""]
    resources: ["pods", "pods/log"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: buildplane-scheduler
  namespace: buildplane
subjects:
  - kind: ServiceAccount
    name: buildplane-scheduler
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: buildplane-scheduler
