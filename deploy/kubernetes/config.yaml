apiVersion: v1
kind: Secret
metadata:
  name: buildplane-secrets
  namespace: buildplane
stringData:
  DATABASE_URL: postgres://buildplane:buildplane@host.docker.internal:5432/buildplane?sslmode=disable
  INTERNAL_TOKEN: dev-internal-token
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: buildplane-config
  namespace: buildplane
data:
  HTTP_ADDR: ":8080"
  REDIS_ADDR: host.docker.internal:6379
  KUBE_NAMESPACE: buildplane
  RUNNER_IMAGE: buildplane-runner:local
  RUNNER_SERVICE_ACCOUNT: buildplane-runner
  PUBLIC_BASE_URL: http://api.buildplane.svc.cluster.local:8080
  GLOBAL_ACTIVE_LIMIT: "10"
  MAX_CPU_MILLIS_IN_FLIGHT: "16000"
  S3_ENDPOINT: host.docker.internal:9000
  S3_ACCESS_KEY: minioadmin
  S3_SECRET_KEY: minioadmin
  S3_BUCKET: buildplane-cache
  S3_USE_SSL: "false"
  SHADOW_SCHEDULER: "true"
