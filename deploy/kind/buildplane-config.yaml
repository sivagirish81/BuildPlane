apiVersion: v1
kind: Namespace
metadata:
  name: buildplane-system
  labels:
    app.kubernetes.io/part-of: buildplane
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: buildplane-runtime-config
  namespace: buildplane-system
  labels:
    app.kubernetes.io/name: buildplane-runtime-config
    app.kubernetes.io/part-of: buildplane
data:
  redis-url: redis://buildplane-redis:6379/0
  migrations-dir: /migrations
  scheduler-batch-size: "10"
  scheduler-interval: 2s
  worker-lease-duration: 30s
  worker-drain-timeout: 25s
  ai-service-url: http://buildplane-ai-service:8090
---
apiVersion: v1
kind: Secret
metadata:
  name: buildplane-postgres
  namespace: buildplane-system
  labels:
    app.kubernetes.io/name: buildplane-postgres
    app.kubernetes.io/part-of: buildplane
type: Opaque
stringData:
  username: buildplane
  password: buildplane_dev_password
  database: buildplane
  database-url: postgres://buildplane:buildplane_dev_password@buildplane-postgres:5432/buildplane?sslmode=disable
