apiVersion: apps/v1
kind: Deployment
metadata:
  name: buildplane-scheduler
  namespace: buildplane-system
  labels:
    app.kubernetes.io/name: buildplane-scheduler
    app.kubernetes.io/part-of: buildplane
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: buildplane-scheduler
  template:
    metadata:
      labels:
        app.kubernetes.io/name: buildplane-scheduler
        app.kubernetes.io/part-of: buildplane
    spec:
      serviceAccountName: buildplane-scheduler
      terminationGracePeriodSeconds: 20
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: scheduler
          image: buildplane/control-plane:dev
          imagePullPolicy: IfNotPresent
          command:
            - /buildplane-scheduler
          ports:
            - name: metrics
              containerPort: 9090
          env:
            - name: BUILDPLANE_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: buildplane-postgres
                  key: database-url
            - name: BUILDPLANE_REDIS_URL
              valueFrom:
                configMapKeyRef:
                  name: buildplane-runtime-config
                  key: redis-url
            - name: BUILDPLANE_MIGRATIONS_DIR
              valueFrom:
                configMapKeyRef:
                  name: buildplane-runtime-config
                  key: migrations-dir
            - name: BUILDPLANE_SCHEDULER_BATCH_SIZE
              valueFrom:
                configMapKeyRef:
                  name: buildplane-runtime-config
                  key: scheduler-batch-size
            - name: BUILDPLANE_SCHEDULER_INTERVAL
              valueFrom:
                configMapKeyRef:
                  name: buildplane-runtime-config
                  key: scheduler-interval
            - name: BUILDPLANE_METRICS_ADDR
              value: :9090
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
---
