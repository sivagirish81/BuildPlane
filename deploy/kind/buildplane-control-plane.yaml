apiVersion: v1
kind: Namespace
metadata:
  name: buildplane-system
  labels:
    app.kubernetes.io/part-of: buildplane
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: buildplane-control-plane
  namespace: buildplane-system
  labels:
    app.kubernetes.io/name: buildplane-control-plane
    app.kubernetes.io/part-of: buildplane
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: buildplane-control-plane
  template:
    metadata:
      labels:
        app.kubernetes.io/name: buildplane-control-plane
        app.kubernetes.io/part-of: buildplane
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: control-plane
          image: buildplane/control-plane:dev
          imagePullPolicy: IfNotPresent
          env:
            - name: BUILDPLANE_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: buildplane-postgres
                  key: database-url
            - name: BUILDPLANE_MIGRATIONS_DIR
              value: /migrations
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
            timeoutSeconds: 1
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 1
            failureThreshold: 3
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
---
apiVersion: v1
kind: Service
metadata:
  name: buildplane-control-plane
  namespace: buildplane-system
  labels:
    app.kubernetes.io/name: buildplane-control-plane
    app.kubernetes.io/part-of: buildplane
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: buildplane-control-plane
  ports:
    - name: http
      port: 80
      targetPort: http
