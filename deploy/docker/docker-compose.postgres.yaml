services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: buildplane
      POSTGRES_PASSWORD: buildplane_dev_password
      POSTGRES_DB: buildplane
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U buildplane -d buildplane"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - buildplane-postgres-data:/var/lib/postgresql/data
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
  ai-service:
    build:
      context: ../..
      dockerfile: deploy/docker/ai-service.Dockerfile
    environment:
      BUILDPLANE_AI_PROVIDER: mock
      BUILDPLANE_AI_PROMPT_VERSION: issue_classifier_v1
    ports:
      - "8090:8090"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/healthz', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 10
  control-plane:
    build:
      context: ../..
      dockerfile: deploy/docker/control-plane.Dockerfile
    command: ["/buildplane-control-plane"]
    environment:
      BUILDPLANE_DATABASE_URL: postgres://buildplane:buildplane_dev_password@postgres:5432/buildplane?sslmode=disable
      BUILDPLANE_MIGRATIONS_DIR: /migrations
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
  scheduler:
    build:
      context: ../..
      dockerfile: deploy/docker/control-plane.Dockerfile
    command: ["/buildplane-scheduler"]
    environment:
      BUILDPLANE_DATABASE_URL: postgres://buildplane:buildplane_dev_password@postgres:5432/buildplane?sslmode=disable
      BUILDPLANE_REDIS_URL: redis://redis:6379/0
      BUILDPLANE_MIGRATIONS_DIR: /migrations
      BUILDPLANE_SCHEDULER_BATCH_SIZE: "10"
      BUILDPLANE_SCHEDULER_INTERVAL: 2s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
  worker-general:
    build:
      context: ../..
      dockerfile: deploy/docker/control-plane.Dockerfile
    command: ["/buildplane-worker"]
    environment:
      BUILDPLANE_DATABASE_URL: postgres://buildplane:buildplane_dev_password@postgres:5432/buildplane?sslmode=disable
      BUILDPLANE_REDIS_URL: redis://redis:6379/0
      BUILDPLANE_MIGRATIONS_DIR: /migrations
      BUILDPLANE_WORKER_POOL: general
      BUILDPLANE_WORKER_LEASE_DURATION: 30s
      BUILDPLANE_WORKER_DRAIN_TIMEOUT: 25s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
  worker-ai:
    build:
      context: ../..
      dockerfile: deploy/docker/control-plane.Dockerfile
    command: ["/buildplane-worker"]
    environment:
      BUILDPLANE_DATABASE_URL: postgres://buildplane:buildplane_dev_password@postgres:5432/buildplane?sslmode=disable
      BUILDPLANE_REDIS_URL: redis://redis:6379/0
      BUILDPLANE_MIGRATIONS_DIR: /migrations
      BUILDPLANE_WORKER_POOL: ai
      BUILDPLANE_WORKER_LEASE_DURATION: 30s
      BUILDPLANE_WORKER_DRAIN_TIMEOUT: 25s
      BUILDPLANE_AI_SERVICE_URL: http://ai-service:8090
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      ai-service:
        condition: service_healthy

volumes:
  buildplane-postgres-data:
