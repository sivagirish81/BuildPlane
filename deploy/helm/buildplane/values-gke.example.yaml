global:
  imagePullPolicy: IfNotPresent

database:
  # Keep false for normal installs: create this Secret outside Helm so database
  # credentials can be rotated without the chart owning secret material.
  createSecret: false
  existingSecret: buildplane-postgres
  urlKey: database-url
  # Only used when database.createSecret=true.
  url: ""

postgres:
  enabled: false

controlPlane:
  image:
    repository: us-central1-docker.pkg.dev/my-gcp-project/buildplane/control-plane
    tag: phase-12-demo

aiService:
  image:
    repository: us-central1-docker.pkg.dev/my-gcp-project/buildplane/ai-service
    tag: phase-12-demo

web:
  image:
    repository: us-central1-docker.pkg.dev/my-gcp-project/buildplane/web
    tag: phase-12-demo

operator:
  image:
    repository: us-central1-docker.pkg.dev/my-gcp-project/buildplane/operator
    tag: phase-12-demo

runtime:
  name: gke-runtime

observability:
  enabled: true
