{{- $root := . -}}
{{- range $name := list "buildplane-control-plane" "buildplane-scheduler" "buildplane-worker-general" "buildplane-worker-ai" "buildplane-ai-service" "buildplane-web" }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $name }}
  labels:
    app.kubernetes.io/name: {{ $name }}
    {{- include "buildplane.labels" $root | nindent 4 }}
{{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: buildplane-no-kubernetes-api
  labels:
    app.kubernetes.io/name: buildplane-no-kubernetes-api
    {{- include "buildplane.labels" . | nindent 4 }}
rules: []
{{- range $name := list "buildplane-control-plane" "buildplane-scheduler" "buildplane-worker-general" "buildplane-worker-ai" "buildplane-ai-service" "buildplane-web" }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $name }}-no-kubernetes-api
  labels:
    app.kubernetes.io/name: {{ $name }}
    {{- include "buildplane.labels" $root | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ $name }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: buildplane-no-kubernetes-api
{{- end }}
