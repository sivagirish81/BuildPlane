{{- if .Values.redis.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: buildplane-redis
  labels:
    app.kubernetes.io/name: buildplane-redis
    {{- include "buildplane.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: buildplane-redis
  template:
    metadata:
      labels:
        app.kubernetes.io/name: buildplane-redis
        app.kubernetes.io/part-of: buildplane
    spec:
      containers:
        - name: redis
          image: {{ include "buildplane.image" .Values.redis.image }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          ports:
            - name: redis
              containerPort: 6379
          readinessProbe:
            tcpSocket:
              port: redis
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: redis
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.redis.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: buildplane-redis
  labels:
    app.kubernetes.io/name: buildplane-redis
    {{- include "buildplane.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: buildplane-redis
  ports:
    - name: redis
      port: 6379
      targetPort: redis
{{- end }}
