{{- if .Values.operator.enabled }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: buildplane-operator
  labels:
    app.kubernetes.io/name: buildplane-operator
    {{- include "buildplane.labels" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: buildplane-operator
  labels:
    app.kubernetes.io/name: buildplane-operator
    {{- include "buildplane.labels" . | nindent 4 }}
rules:
  - apiGroups:
      - buildplane.io
    resources:
      - buildplaneruntimes
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - buildplane.io
    resources:
      - buildplaneruntimes/status
    verbs:
      - get
      - update
      - patch
  - apiGroups:
      - apps
    resources:
      - deployments
    verbs:
      - get
      - list
      - watch
      - patch
      - update
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: buildplane-operator
  labels:
    app.kubernetes.io/name: buildplane-operator
    {{- include "buildplane.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: buildplane-operator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: buildplane-operator
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: buildplane-operator
  labels:
    app.kubernetes.io/name: buildplane-operator
    {{- include "buildplane.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.operator.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: buildplane-operator
  template:
    metadata:
      labels:
        app.kubernetes.io/name: buildplane-operator
        app.kubernetes.io/part-of: buildplane
    spec:
      serviceAccountName: buildplane-operator
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: operator
          image: {{ include "buildplane.image" .Values.operator.image }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          args:
            - --metrics-bind-address=:8080
            - --health-probe-bind-address=:8081
          env:
            - name: WATCH_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          ports:
            - name: metrics
              containerPort: 8080
            - name: health
              containerPort: 8081
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
          resources:
            {{- toYaml .Values.operator.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
---
apiVersion: v1
kind: Service
metadata:
  name: buildplane-operator-metrics
  labels:
    app.kubernetes.io/name: buildplane-operator
    {{- include "buildplane.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: buildplane-operator
  ports:
    - name: metrics
      port: 8080
      targetPort: metrics
{{- end }}
