global:
  imagePullPolicy: IfNotPresent

database:
  # Keep false for normal installs: create this Secret outside Helm so database
  # credentials can be rotated without the chart owning secret material.
  # Local kind development can set this to true together with postgres.enabled.
  createSecret: false
  existingSecret: buildplane-postgres
  urlKey: database-url
  # Only used when database.createSecret=true.
  url: ""

postgres:
  # Disabled by default because production should use managed or separately
  # operated PostgreSQL. Enable in values-kind.yaml for local Helm learning.
  enabled: false
  image:
    repository: postgres
    tag: 17-alpine
  auth:
    username: buildplane
    password: buildplane_dev_password
    database: buildplane
  persistence:
    size: 1Gi
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

runtimeConfig:
  redisURL: redis://buildplane-redis:6379/0
  migrationsDir: /migrations
  schedulerBatchSize: "10"
  schedulerInterval: 2s
  workerLeaseDuration: 30s
  workerDrainTimeout: 25s
  aiServiceURL: http://buildplane-ai-service:8090

controlPlane:
  replicas: 2
  image:
    repository: buildplane/control-plane
    tag: dev
  resources:
    requests:
      cpu: 25m
      memory: 32Mi
    limits:
      cpu: 250m
      memory: 128Mi

scheduler:
  replicas: 1
  resources:
    requests:
      cpu: 25m
      memory: 32Mi
    limits:
      cpu: 250m
      memory: 128Mi

workers:
  general:
    replicas: 2
    resources:
      requests:
        cpu: 25m
        memory: 32Mi
      limits:
        cpu: 250m
        memory: 128Mi
  ai:
    replicas: 1
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 500m
        memory: 256Mi

aiService:
  replicas: 1
  image:
    repository: buildplane/ai-service
    tag: dev
  provider: mock
  promptVersion: issue_classifier_v1
  resources:
    requests:
      cpu: 50m
      memory: 96Mi
    limits:
      cpu: 500m
      memory: 256Mi

web:
  enabled: true
  replicas: 1
  image:
    repository: buildplane/web
    tag: dev
  service:
    type: ClusterIP
  resources:
    requests:
      cpu: 25m
      memory: 32Mi
    limits:
      cpu: 250m
      memory: 128Mi

redis:
  enabled: true
  image:
    repository: redis
    tag: 7-alpine
  resources:
    requests:
      cpu: 25m
      memory: 32Mi
    limits:
      cpu: 250m
      memory: 128Mi

operator:
  enabled: true
  replicas: 1
  image:
    repository: buildplane/operator
    tag: dev
  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      cpu: 250m
      memory: 192Mi

runtime:
  enabled: true
  name: default-runtime

observability:
  enabled: true
  prometheus:
    image:
      repository: prom/prometheus
      tag: v3.0.1
  grafana:
    image:
      repository: grafana/grafana
      tag: 11.5.0
