apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: buildplaneruntimes.buildplane.io
  labels:
    app.kubernetes.io/name: buildplaneruntimes.buildplane.io
    app.kubernetes.io/part-of: buildplane
spec:
  group: buildplane.io
  scope: Namespaced
  names:
    plural: buildplaneruntimes
    singular: buildplaneruntime
    kind: BuildPlaneRuntime
    shortNames:
      - bpr
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Ready
          type: string
          jsonPath: .status.conditions[?(@.type=="Ready")].status
        - name: Scheduler
          type: integer
          jsonPath: .spec.schedulerReplicas
        - name: General
          type: integer
          jsonPath: .spec.workerPools.general.replicas
        - name: AI
          type: integer
          jsonPath: .spec.workerPools.ai.replicas
      schema:
        openAPIV3Schema:
          type: object
          required:
            - spec
          properties:
            apiVersion:
              type: string
            kind:
              type: string
            metadata:
              type: object
            spec:
              type: object
              properties:
                schedulerReplicas:
                  type: integer
                  format: int32
                  minimum: 0
                  maximum: 5
                  default: 1
                workerPools:
                  type: object
                  properties:
                    general:
                      type: object
                      properties:
                        replicas:
                          type: integer
                          format: int32
                          minimum: 0
                          maximum: 10
                          default: 2
                    ai:
                      type: object
                      properties:
                        replicas:
                          type: integer
                          format: int32
                          minimum: 0
                          maximum: 10
                          default: 1
            status:
              type: object
              properties:
                observedGeneration:
                  type: integer
                  format: int64
                conditions:
                  type: array
                  items:
                    type: object
                    required:
                      - type
                      - status
                      - lastTransitionTime
                      - reason
                      - message
                    properties:
                      type:
                        type: string
                      status:
                        type: string
                        enum:
                          - "True"
                          - "False"
                          - Unknown
                      observedGeneration:
                        type: integer
                        format: int64
                      lastTransitionTime:
                        type: string
                        format: date-time
                      reason:
                        type: string
                      message:
                        type: string
                deployments:
                  type: array
                  items:
                    type: object
                    required:
                      - name
                      - desired
                      - available
                      - ready
                    properties:
                      name:
                        type: string
                      desired:
                        type: integer
                        format: int32
                      available:
                        type: integer
                        format: int32
                      ready:
                        type: boolean
